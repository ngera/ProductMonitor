name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Unit tests
        run: pytest -q
      # The README's first instruction. Runs from a fresh clone, so a demo
      # bundle file that is missing from git fails here.
      - name: Offline demo smoke test
        run: |
          product-monitor demo --no-open-browser
          test -f reports/demo/2026-W29/index.html
