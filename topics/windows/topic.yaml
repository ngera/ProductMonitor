# Topic metadata for the Windows reference deployment.
#
# `id` matches the directory name and is used as the URL slug / data path key.
# `extras_module` and `extras_class` point at the per-topic Pydantic schema
# extension (topics/windows/extras.py). The orchestrator composes the topic's
# extras schema onto the core Classification at runtime.
id: windows
display: Microsoft Windows
description: |
  Public user feedback about Microsoft Windows (the operating system) —
  bugs, feature requests, KB rollout issues, hardware compatibility,
  Insider channel feedback.

extras_module: extras           # topics/windows/extras.py
extras_class: WindowsExtras

# Optional: per-topic scheduling hint (used by docs / UI; not enforced by core).
schedule: weekly
