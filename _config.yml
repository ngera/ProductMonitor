remote_theme: ngera/caliper-pages
plugins:
  - jekyll-remote-theme

# Publish README + public docs under documents/*.md.
# Keep product/pipeline code and local-only notes off the Pages site.
exclude:
  - "Claude outputs"
  - CLAUDE.md
  - config
  - documents/archive
  - documents/console-kit
  - eval
  - pipeline
  - plugins
  - products
  - report_templates
  - scripts
  - requirements.txt
  - pyproject.toml
  - Dockerfile
  - docker-compose.yml
  - run_weekly.bat
  - .env.example