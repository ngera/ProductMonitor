title: postgres - slow query logging - log_min_duration_statement
body: 'Trying to identify slow queries I have

  log_min_duration_statement = 1000

  .

  I get i.e. a log line like ...

  2026-07-10 10:40:28.228 CEST [2683651] LOG:  duration: 10441.879 ms  statement:
  UPDATE content SET [...]

  that means

  the query mentioned in that like took 10.441 seconds to run

  it would not have been logged if

  log_min_duration_statement = 12000

  is that a fair understanding?

  are there any other config parameter involved to the a hold of this?'
