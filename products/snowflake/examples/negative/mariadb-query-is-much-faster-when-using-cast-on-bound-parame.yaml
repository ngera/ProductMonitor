title: MariaDB query is much faster when using CAST() on bound parameters?
body: "We use a MariaDB database (with stored procedures) and pass params via PHP\
  \ middleware.\nA minimal example of the table and view defintion I'm using:\nCREATE\
  \ DATABASE cast_demo\nCHARACTER SET utf8mb4 COLLATE utf8mb4_general_ci;\nUSE cast_demo;\n\
  SET NAMES utf8mb4 COLLATE utf8mb4_general_ci;\n\nCREATE TABLE example_data (\n \
  \   id INT NOT NULL PRIMARY KEY,\n    x VARCHAR(32) NOT NULL,\n    y VARCHAR(32)\
  \ NOT NULL,\n    amount INT NOT NULL,\n    KEY ix_xy (x, y)\n) ENGINE=InnoDB\n \
  \ DEFAULT CHARACTER SET utf8mb4 COLLATE utf8mb4_general_ci;\n\nINSERT INTO example_data\
  \ (id, x, y, amount)\nSELECT seq,\n       IF(MOD(seq, 1000) = 0, 'foo', CONCAT('x',\
  \ MOD(seq, 1000))),\n       IF(MOD(seq, 10) = 0, 'bar', CONCAT('y', MOD(seq, 10))),\n\
  \       1\nFROM seq_1_to_100000;\n\nCREATE VIEW example_view AS\nSELECT x, y, SUM(amount)\
  \ AS total_amount\nFROM example_data\nGROUP BY x, y;\nIf I execute the following\
  \ prepared statement directly in a client like DBeaver with the code above it takes\
  \ approximately\n0.083 seconds\nto return one record.\nSET @x = 'foo';\nSET @y =\
  \ 'bar';\n \nPREPARE test FROM 'SELECT * FROM cast_demo.example_view WHERE x = ?\
  \ AND y = ?';\n\nEXECUTE test USING @x, @y\nThen when I try with casting:\nSET @x\
  \ = 'foo';\nSET @y = 'bar';\n\nPREPARE test FROM 'SELECT * FROM \ncast_demo.example_view\
  \ WHERE x = CAST(? AS CHAR CHARACTER SET utf8mb4) AND \ny = CAST(? AS CHAR CHARACTER\
  \ SET utf8mb4)';\n\nEXECUTE test USING @x, @y;\nThis only takes\n0.005 seconds\n\
  to get the same record.\nUsing a table with real data this becomes 1.5s vs 0.3s\
  \ per API call\nFrom what I can gather it could have something to do with MariaDB's\
  \ optimizer but I didn't find any similar case online or any documentation on why\
  \ a cast (or lack thereof) would cause this behavior especially since the cast itself\
  \ doesn't change anything for my params as far as I can see. They both have the\
  \ same charsets (utf8mb4) with and without the cast so the performance drop shouldn't\
  \ be caused by a mismatch.\nWhen inspecting the variable type both in the examples\
  \ and real data both the column and parameters are VARCHAR.\nOptimizer trace (without\
  \ cast)\n{\n  \"steps\": [\n    {\n      \"join_preparation\": {\n        \"select_id\"\
  : 1,\n        \"steps\": [\n          {\n            \"view\": {\n             \
  \ \"table\": \"example_view\",\n              \"select_id\": 2,\n              \"\
  algorithm\": \"materialized\"\n            }\n          },\n          {\n      \
  \      \"join_preparation\": {\n              \"select_id\": 2,\n              \"\
  steps\": [\n                {\n                  \"expanded_query\": \"/* select#2\
  \ */ select cast_demo.example_data.x AS x,cast_demo.example_data.y AS y,sum(cast_demo.example_data.amount)\
  \ AS total_amount from example_data group by cast_demo.example_data.x,cast_demo.example_data.y\"\
  \n                }\n              ]\n            }\n          },\n          {\n\
  \            \"expanded_query\": \"/* select#1 */ select example_view.x AS x,example_view.y\
  \ AS y,example_view.total_amount AS total_amount from example_view where example_view.x\
  \ = 'foo' and example_view.y = 'bar'\"\n          }\n        ]\n      }\n    },\n\
  \    {\n      \"join_optimization\": {\n        \"select_id\": 1,\n        \"steps\"\
  : [\n          {\n            \"condition_processing\": {\n              \"condition\"\
  : \"WHERE\",\n              \"original_condition\": \"example_view.x = 'foo' and\
  \ example_view.y = 'bar'\",\n              \"steps\": [\n                {\n   \
