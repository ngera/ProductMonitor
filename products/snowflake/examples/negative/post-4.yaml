body: '@ ulveon So now that that is out of the way :blobcatgooglyheadache:​ Welp...
  how do we define what is not about human rights then? It seems like genAI (and in
  particular, chatbots and other agentic AI) conflicts with our ability not to depend
  on them and their providers, might irreversibly hinder our cognitive capabilities
  almost immediately after first use, is a tool that overwhelmingly has more potential
  for job and value destruction than actual, sustainable construction, are produced
  and run with huge energy bills to the point that some people are already getting
  denied electricity at their homes, so on, so forth. I guess the only reason why
  we should be debating it is because impact is unclear. But if you think that we
  already went past that threshold, it makes sense to classify it as "not up for debate".
  And that''s just one of the reasons why debate is so difficult. We do, in fact,
  have self-determination — fascists might not like it but then turn the other way
  around and insist on the concepts of "free will" and "freedom" because they know
  they want theirs to be the # objective # truth . Anyway. This means that each one
  is constantly, subjectively drawing their own lines. Why so? Because that self-determination,
  that inner will and interpretation of the world, is inherent to consciousness and
  self-preservation. We need to draw lines to understand and interact with the world,
  to feel safe and seek what we want and need. And that includes defining what we
  talk about and to which extent, and usually it''s a huge mental toll for seemingly
  little to no benefit... I think you can agree about this one :baa:​ And yeah, many
  factors include: Tying your identity to friends, ideals, ideologies, etc., which
  in turns means that conceding on a point is risking your very sense of self, questioning
  what you have done with your life, your social relationships, how you cared for
  your children, etc. This is furthermore entrenched with trust in one''s cognition
  and trust in the outside world. Think of terms like "common sense", "reality" being
  "obvious", etc. What that depicts is vulnerability, someone relying on superficiality
  and authority to build everything else upon. That gets ROUGH. Being vulnerable to
  abuse, with trauma hindering your ability to neutrally analyze a situation. You
  see a pattern and immediately run away from it. One, of course, needs to learn to
  grow from PTSD and get better at it, but it''s still a hard process to get there.
  And there''s no real echo chambers, but there is mutual reinforcement, which if
  unchecked, is an easy way to detach from reality and end up with something resembling
  psychosis (oh hey where have I heard of that one) Just being a shit person. Wanting
  to dunk on others, # rekting the # soyboy # snowflake # woke # liberals with # facts
  # and # logic , treating bullying as a moral crusade, etcetc. This is where "the
  cruelty is the point" comes from. And finally: not really caring and just following
  the trend. So basically, some just follow wherever social norms around them go (usually
  handed over top-down from hard power) and can change in a blink of an eye. Those
  are a lot of reasons, and most remarkably, they either involve the network effect,
  or extremely fundamental parts about people. It''s understandable to want to give
  up. And in that regard, all I can say is that we''re moving faster than ever, and
  while Planck''s principle might be largely true, we''re still seeing a huge generational
  uplift, with much more rational folks who have their empathy towards others and
  their priorities in life in a much better position. So change is very much still
  feasible. Just, more slowly than I wish it was.'
