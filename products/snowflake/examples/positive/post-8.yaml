body: 'Snowflake let''s you roll your own Aggregate function using the ACCUMULATE
  Lambda Function. ACCUMULATE first initializes an aggregation context, then iterates
  through each non-NULL input value to update it. If needed, Merge combines partial
  contexts from parallel processing, and Terminate uses the completed context to return
  the final aggregate result. # Snowflake http:// quettabyte.net/gist.php?id=Ian TI'
