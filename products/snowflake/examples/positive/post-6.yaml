body: 'Snowflake permite esquivar la censura en internet convirtiendo navegadores
  web comunes en "puentes" temporales hacia la red Tor. ❄️🌐 Un usuario en un país
  censurado se conecta a ti mediante WebRTC (como una videollamada). Tu navegador
  actúa de intermediario efímero y retransmite su tráfico cifrado a Tor. No almacena
  datos ni expone tu IP a las webs que él visita. Un clic y ayudas a dar libertad
  digital. # Tor # Privacidad # Snowflake # Ciberseguridad # LibertadDigital # AntiCensura'
