title: The US government just banned Roombas
body: When the Trump administration announced yesterday that it was banning "advanced
  robotic devices" from entering the United States , the headlines were all about
  humanoids . But spying doesn't require legs - and neither does the FCC's robot ban.
  The robot ban will sweep up robot vacuum cleaners too , FCC media relations director
  Katie Gorscak confirms to The Verge. It's not coming for your existing Roomba, and
  companies can keep importing and selling already approved ones. But the government
  claims that future foreign robots pose a national security risk, and even robovac
  companies are suddenly being asked to commit to US manufacturing. Whi … Read the
  full story at The Verge.
