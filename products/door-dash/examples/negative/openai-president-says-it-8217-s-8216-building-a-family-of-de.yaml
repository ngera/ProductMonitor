title: OpenAI president says it&#8217;s &#8216;building a family of devices&#8217;
  for its AI chatbots
body: In an interview with our friend Joanna Stern on her YouTube channel , OpenAI
  president Greg Brockman said the company is working on a "family of devices" for
  interacting with its AI models. However, Brockman didn't confirm reports that one
  of those devices is a smart speaker OpenAI's rumored to be launching in 2027, or
  earlier rumors that the device might be a wearable like the Humane AI pin. He didn't
  give a release date, either, only saying that "you can expect them soon." When asked
  about whether Apple's lawsuit against OpenAI could impact the devices it's working
  on with former Apple designer Jony Ive , Brockman said, "We are focused on o … Read
  the full story at The Verge.
