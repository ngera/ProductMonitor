title: deleted my account
body: after 5+ years of being a loyal door dssh customer i finally decided to delete
  my account. there haven’t been any real incentives to even use the app lately with
  most restaurants not offering deals anymore. then to make matters worse as I was
  just about to place an order my all my payment methods had been removed but I just
  know when my dash pass fee is due tomorrow. They were going to charge every single
  payment method so I’m fed up with DoorDash and I’m gonna have to just start driving
  or walking to wherever I wanna eat at. makes me sad. as a transient person that
  has received door dash deliveries in the most random places over the years🥹
