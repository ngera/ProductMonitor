title: I spent 25+ years at Microsoft, and Windows is getting the care it deserves
  again
body: Hey all. This article is written by Ewan, who spent more than 26 years at Microsoft,
  where he worked across across technical, product, customer, partner and cloud-focused
  roles. He was also an early Windows NT professional, and has written about Microsoft
  products, productivity and enterprise technology through his Tip o’ the Week series.
  Microsoft veterans are also pumped about Windows 11's future, and I can tell you
  with confidence that major changes are coming, including improved memory management.
