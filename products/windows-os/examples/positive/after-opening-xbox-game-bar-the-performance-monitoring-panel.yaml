title: After opening Xbox Game Bar, the performance monitoring panel does not display
  any data
body: After pressing Win + G to open the Xbox Game Bar, the performance monitoring
  widget shows that it cannot retrieve performance data. I tried restarting the Game
  Bar, updating my graphics card drivers, and turning the background recording feature
  off and on again, but none of these solutions worked.
