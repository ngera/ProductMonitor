title: Windows 11 always freezes or restarts when unplugged
body: Windows 11 always freezes or restarts when unplugged. It happens every time
  I use my laptop and do something after I unplugged it. It's getting annoying. One
  day I checked the events before and after the crash and I found these. Can somebody
  tell me what's wrong and how do I fix it?
