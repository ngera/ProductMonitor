title: How do i check if a trojan/wacatac is running in the background
body: I need to determine if the trojan or Wacatac malware is actively running in
  the background on my Windows system, but I'm not sure how to properly check for
  hidden processes that might be disguised as legitimate system tasks. Could someone
  guide me on the best way to verify if this specific threat is currently executing,
  whether through Task Manager inspection, using built-in Windows security tools,
  or examining startup entries and suspicious network connections, so I can confirm
  if my system is compromised or if the detection was a false positive?
