  areas:
  - ui_customization
  summary: User reports that Windows 10 animations and visual effects are heavily
    consuming CPU and memory resources, causing system lag and sluggish performance
    even with few applications open.
notes: Performance issue with specific cause (animations/effects) and measurable impact
  (CPU/RAM)—actionable feedback.
