title: A large number of animations and special effects consumed the CPU and memory.
body: I have noticed that a large number of animations and special effects in Windows
  10 are heavily consuming my CPU and memory resources, which seems to be a major
  factor behind my system's lag. Even with only a few applications open, these visual
  effects consistently push my processor and RAM usage to high levels, making the
  overall experience feel sluggish and unresponsive during normal use.
polarity: negative_example
holdout_eval: false
