title: WOA 29639.100 explorer.exe freeze when open some folders
body: When attempting to open certain folders, File Explorer's CPU usage spikes rapidly,
  and some or all file items become invisible. Stack traces viewed via Process Monitor
  reveal that the activity consistently involves the `SetLinkFlags` function shown
  in the image. Third-party file management tools such as File and 7-Zip operate normally,
  and issues related to non-system Shell components have already been ruled out by
  ShellExView.   7zip can show all files normally.  
polarity: negative_example
holdout_eval: false
labels:
