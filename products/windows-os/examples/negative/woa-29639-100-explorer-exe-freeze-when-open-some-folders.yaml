  summary: File Explorer freezes and CPU spikes when opening certain folders on Windows
    on ARM build 29639.100. File items become invisible, with stack traces pointing
    to the SetLinkFlags function. Third-party tools like 7-Zip work normally, and
    non-system Shell components have been ruled out.
notes: Specific bug report with technical details (SetLinkFlags, Process Monitor)
  and reproducible steps—excellent for training classifier on valid issues.
