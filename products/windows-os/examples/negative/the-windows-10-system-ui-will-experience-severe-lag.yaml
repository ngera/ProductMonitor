title: The Windows 10 system UI will experience severe lag.
body: My Windows 10 system UI has been experiencing severe lag lately. Simple actions
  like clicking the Start menu, opening the notification center, or even switching
  between application windows often result in the entire interface freezing for up
  to 30 seconds at a time, during which only my mouse cursor remains responsive, and
  this happens consistently throughout my daily workflow regardless of the applications
  I have running.
polarity: negative_example
holdout_eval: false
