  summary: User reports severe UI lag on Windows 10, with the interface freezing for
    up to 30 seconds when performing simple actions like opening the Start menu, notification
    center, or switching windows. Only the mouse cursor remains responsive during
    freezes, occurring consistently throughout daily use.
notes: Reproducible UI lag with specific triggers (Start menu, notification center)
  and quantified freeze duration—strong bug report.
