title: Six Sigma promotions won't go away.
body: Hi, and know that I'm Microsoft experienced but not a coder or programmer. 
  I found a Six Sigma attachment to my online academic course, and the institution
  claims it isn't on their screens, and isn't approved nor endorsed by them. Now the
  promotions are flooding my MSN feed. I tried the steps on your and various other
  outlets with no luck.  How do I stop it? I'm not a Six Sigma practitioner nor a
  supporter. How did they get into my system, and how to I expell them? 
