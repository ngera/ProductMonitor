title: The privacy and data collection settings in Windows 10 are quite complex.
body: My Windows 10 system UI has been experiencing severe lag recently. Simple actions
  like clicking the Start menu, opening the notification center, or switching between
  app windows often cause the interface to freeze for up to 30 seconds, with only
  the mouse cursor staying responsive, and this happens consistently throughout my
  daily workflow regardless of which applications are running.
