title: If your Supabase disappeared tomorrow, what would you do?
body: 'C''est un peu une question catastrophique. Si votre fournisseur de backend
  disparaissait demain, combien de temps pensez-vous qu''il vous faudrait pour remettre
  le produit en marche ailleurs ? Quelques jours ? Quelques semaines ? Plusieurs mois
  ? Et quelle serait la partie la plus difficile à remplacer ? Edit : That''s correct
  for the database; however, Supabase is not just a PostgreSQL database, but also
  offers other services such as Edge Functions and Realtime, which seem extremely
  complex to export without risk of breaking production.'
