title: How do you know if a Supabase table stops updating or the amount of data suddenly
  changes?
body: I've been having this issue where one of my vercel cron jobs, edge functions,
  or whatever sync I have stops working, and I only notice because there’s no new
  data in the table, or because there’s way less data than usual. I'm not sure how
  common this is or how people notice it. Or is it just a matter of writing better
  cron jobs?
