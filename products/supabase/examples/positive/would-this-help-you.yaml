title: would this help you?
body: Hi everyone, I’m a penetration tester building Permetra , a nonprofit, open-source
  security tool for Supabase. Permetra visualizes users, roles, grants, tables, and
  RLS policies as an interactive BloodHound-inspired graph. It helps developers understand
  who can access what, why that access exists, and where unexpected paths to sensitive
  data may exist. The repository is currently private while I prepare the first public
  release. I’m looking for feedback, contributors, and early testers. What is your
  hardest Supabase authorization, RLS, or tenant-isolation problem?
