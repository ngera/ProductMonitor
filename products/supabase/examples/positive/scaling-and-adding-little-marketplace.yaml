title: Scaling and adding little marketplace
body: Hey folks I'm building a mobile application as a side project I liked supabase
  as it saved me a lot of effort tbh as a solo developer I want to add a marketplace
  to my app, I would like to ask what do you think about using supabase for that purpose?
  and how much scale can supabase handle? I mean just in case our app worked, can
  it handle like 20k concurrent users? sellers data and products .etc
