title: iPhone owners can now submit claims in Apple’s $250 million Siri AI settlement
body: Apple is paying $250 million to settle claims that it failed to deliver an AI-upgraded
  Siri - and now, eligible iPhone owners can submit a claim for a payout. If you live
  in the US and purchased an iPhone 15 Pro, iPhone 15 Pro Max, or any iPhone 16 model
  between June 10th, 2024, and March 29th, 2025, you can file a claim on the settlement's
  website , as reported earlier by MacRumors . You can receive an estimated $25 per
  eligible device, but the settlement's website notes that this can increase to $95
  depending on how many people file claims. To file a claim, you'll need to enter
  your name, contact information, and iPhone serial number on the … Read the full
  story at The Verge.
