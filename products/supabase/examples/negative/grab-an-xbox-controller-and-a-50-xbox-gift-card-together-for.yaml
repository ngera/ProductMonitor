title: Grab an Xbox controller and a $50 Xbox gift card together for just $80
body: 'Newegg is hosting a bundle that includes Microsoft’s wireless Xbox controller
  (in black) and a $50 digital Xbox gift card together for $80. Given that this model
  typically sits around $50 to $60 depending on the color you want, this is a fantastic
  value since it essentially knocks its price down to $30. Another way of thinking
  about it is you’re paying full price for the controller, but getting a big discount
  on the gift card. Xbox Wireless Controller Where to Buy: $80 at Newegg (with $50
  gift card) The controller included is a great option for Xbox or for PC. It supports
  Bluetooth connectivity, and it’s also a solid wireless gamepad to connect to a Steam
  Deck or any other gaming handheld that can be docked to a TV. While it lacks Hall
  effect sticks, it’s the best midrange controller from Microsoft yet, with a premium-feeling,
  comfortable design, a headphone jack, and good battery life (it supports swappable
  AA batteries). window.HYPE_DESK_CONFIG = { productImageUrl: "https://platform.theverge.com/wp-content/uploads/sites/2/2026/09/Corsair_Vanguard_96_Hype_Desk_1600x900.jpg",
