  96 Mechanical Gaming Keyboard", shortDescription: "Refresh your setup with the CORSAIR
  VANGUARD 96 Mechanical Gaming Keyboard, featuring Pacific Blue keycaps, an included
  Matcha Green keycap set, and a space-saving 96% layout.", longDescription: "Give
  your desk a fresh look with the CORSAIR VANGUARD 96 Mechanical Gaming Keyboard.
  It comes with Pacific Blue keycaps pre-installed plus a complete Matcha Green keycap
  set, making it easy to switch up your setup. Its compact 96% design keeps the number
  pad and arrow keys while packing in CORSAIR MLX Plasma mechanical switches, an integrated
  color LCD screen, a multifunction rotary dial, hot-swappable switch support, 8,000Hz
  hyper-polling, and Stream Deck integration. From September 21 through September
  27, the complete bundle is available for $129.99, down from $189.99 — a savings
  of $60.", purchaseUrl: "https://go.corsair.com/c/482924/490888/8513?subId1=VergeHypeDesk&subId2=CorsairArticle92126&u=https%3A%2F%2Fwww.corsair.com%2Fus%2Fen%2Fp%2Fbundles%2Fvanguard96-pacificblue-matchagreen-keyboard-keycap-bundle-na%2Fvanguard96-pacificblue-matchagreen-keyboard-keycap-bundle-na&partnerpropertyid=7032191",
  purchaseLinkText: "SHOP AT CORSAIR" }; Other great Verge-approved deals The Aurzen
  tri-fold mini projector is an awesome gadget. We said as much in our review , wherein
  Verge deputy editor Thomas Ricker used it in all sorts of scenarios to put it to
  the test. Normally $299, the USB-C chargeable projector is $249.99 at Best Buy for
  the rest of the day. Despite its small size, it’s surprisingly bright, and it easily
  connect to Android or iPhone so you can get to mirroring your games and other locally-stored
  content (or stuff that’s streamed via Plex or a similar service). Though, if it’s
  DRM-protected shows or movies you want to beam on your wall or makeshift surface,
  you’ll unfortunately need Aurzen’s pricey CastPlay Pro dongle that’s currently $105.
  I don’t want to jinx our good fortune, but I’ve been finding some appealing laptop
  deals recently. The latest is Acer’s Chromebook Plus Spin 514 , which is one of
  the best, most well-rounded models available. Sure, it’s no high-end Googlebook
  , but it’s a pretty solid laptop for $499 at Best Buy (originally $749, the discount
  expires later today). It has a 14-inch 1200p touchscreen with a foldable 2-in-1
  design, and its specs include the MediaTek Kompanio Ultra processor, 12GB RAM, 256GB
  of SSD storage, Wi-Fi 7 support. Given its Chromebook Plus designation, it includes
  one year of free access to Google AI Pro, which grants 5TB of cloud storage, YouTube
  Premium Lite, Google Home Premium, and other perks . The price keeps falling at
  Amazon on Ugreen’s Nexode Pro multi-port wall charger . Originally $89.99, it has
  almost never sold for that amount. In fact, it dropped to $49.99 briefly following
  its debut, and has only dropped to $59.99 — its current price — once before. This
  is the kind of gadget that anyone who owns multiple USB-C chargeable tech products
  should have. It tops out at 140W speed when you use just one of its USB-C ports,
  and it can divvy up 160W of total power across five gadgets that are plugged in
  at once.'
