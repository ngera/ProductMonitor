id: supabase
display: Supabase
description: |
  Supabase is an open-source Firebase alternative that provides a complete backend-as-a-service platform built on Postgres. It offers authentication, real-time data synchronization, edge functions, file storage, vector embeddings, and instant REST APIs—enabling developers to build and scale applications without managing infrastructure.

schedule: weekly

