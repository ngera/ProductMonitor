scope_in:
- Supabase platform features (auth, database, edge functions, realtime, storage, vectors)
- Developer experience and documentation quality
- Performance, reliability, and security of Supabase infrastructure
- Pricing and billing concerns
scope_out:
- General Postgres database issues unrelated to Supabase
- Third-party integrations (OpenAI, Hugging Face) unless directly tied to Supabase
  functionality
- Client framework issues (React, Next.js, Flutter) unless caused by Supabase
