id: resend
display: Resend
description: |
  Resend is an email delivery platform designed for developers, offering transactional and marketing email services with a focus on developer experience. It provides SDKs for multiple programming languages, React-based email templating, detailed analytics, and advanced deliverability features like DKIM, SPF, and DMARC authentication to ensure emails reach inboxes reliably.

schedule: weekly

