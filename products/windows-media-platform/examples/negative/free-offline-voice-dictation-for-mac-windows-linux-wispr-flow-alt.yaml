title: free offline voice dictation for Mac/Windows/Linux (Wispr Flow alt)
body: "Yap – free offline voice dictation for Mac/Windows/Linux (Wispr Flow alt) (github.com/akuchis)\r\
  \n24 points by AkuchiS 17 hours ago | hide | past | favorite | 5 comments\\\r\n\r\
  \n\t\r\n_leom 9 hours ago | next [–]\r\n\r\nLast commit authored by Claude and Claude\
  \ desktop... Well this is no longer of interest for me!\r\nreply\r\n\r\n\t\r\njeffyaw\
  \ 4 hours ago | parent | next [–]\r\n\r\ni bet 10+ things you used today were authored\
  \ by claude in one place or another.\r\nreply\r\n\r\n\t\r\nd4rkp4ttern 7 hours ago\
  \ | prev | next [–]\r\n\r\nMy current fav STT is Hex, MacOS only:\r\nhttps://github.com/kitlangton/Hex\r\
  \n\r\nNear-instant accurate-enough transcription using local Parakeet V3.\r\n\r\n\
  Handy is multi-platform, also great:\r\n\r\nhttps://github.com/cjpais/Handy\r\n\r\
  \nEvery time a new STT model or app is announced, I see if it displaces Hex for\
  \ me but so far none have.\r\n\r\nI’ll check out Yap though.\r\n\r\nreply\r\n\r\n\
  \t\r\ntheturtletalks 4 hours ago | parent | next [–]\r\n\r\nHave you tried FluidVoice?\
  \ Comes close to those 2 imo.\r\nI’m tracking them all here:\r\n\r\nhttps://opensource.builders/alternatives/superwhisper\r\
  \n\r\nreply\r\n\r\n\t\r\ntaffydavid 9 hours ago | prev | next [–]\r\n\r\nI love\
  \ on-device transcription apps, but this looks like yet another AI generated whisper\
  \ wrapper. I'm put off by the readme which is clearly LLM generated, with emdash\
  \ all over the place and bits that smell of user questions turned into talking points.\r\
  \n> Why not the Fn / key? It's the obvious one-finger choice, but on macOS the Fn\
  \ key emits no real keypress — only a hidden hardware flag — so\r\n\r\nAnd\r\n\r\
  \n> macOS permissions (read this if the hotkey \"does nothing\")\r\n\r\nSorry but\
  \ I can't see a reason to use this over something tried and tested like Handy, which\
  \ is free, open source, on-device, does post capture correction and isn't limited\
  \ to whisper (you can use parakeet v3 which I find way better than whisper)"
