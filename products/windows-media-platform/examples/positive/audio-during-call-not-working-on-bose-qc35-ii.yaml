  \nApr 05, 2023\r\nmuhammad_kekereekun thanks for the tips. Below my feedback.\r\n\
  \r\n \r\n\r\n1. Firmware is up-to-date\r\n\r\n2. \"Headset (Bose...)\" is selected\
  \ in Teams and in Windows sound settings.\r\n\r\nTomGeerts_1-1680691772270.png\r\
  \n\r\n3. Unchecked the box, but doesn't seem to change anything.\r\n\r\n4. BINGO!\
  \ This fixed the problem... but I shut down my PC every day, so why would a manual\
  \ restart of the service be required?\r\n\r\n5. Headphones work perfectly on my\
  \ Android phone with the Teams app.\r\n\r\n \r\n\r\nExtra info:\r\n\r\nIn Windows\
  \ sound settings, I see 2 different output devices:\r\n\r\n\"Headphones (Bose...)\"\
  \ --> I heard sound when I click Test (before restart of audio service)\r\n\"Headset\
  \ (Bose...)\" --> I didn't hear sound when I click on Test (before restart of audio\
  \ service)\r\n\r\nmuhammad_kekereekun's avatar\r\nmuhammad_kekereekun\r\nIron Contributor\r\
  \nto TomGeerts\r\nApr 05, 2023\r\nI'm glad that restarting the Windows Audio service\
  \ fixed the problem. As for your question about why a manual restart of the service\
  \ was required, sometimes the audio service may encounter errors or conflicts with\
  \ other applications or services, which can cause it to stop functioning properly.\
  \ A restart of the service can clear any issues and help it function normally again.\r\
  \n\r\nRegarding the two different output devices you see in the Windows sound settings,\
  \ \"Headphones (Bose...)\" is likely the stereo audio output, while \"Headset (Bose...)\"\
  \ is the mono audio output that is used for communication applications like Microsoft\
  \ Teams. It's normal to see both of these outputs listed for Bluetooth headphones\
  \ with built-in microphones.\r\n\r\nIf the issue occurs again in the future, you\
  \ can try automating the restart of the Windows Audio service by creating a batch\
  \ file that runs the following command:\r\nnet stop AudioSrv\r\nnet start AudioSrv\r\
  \n\r\nSave the file as a .bat file and create a scheduled task in Windows Task Scheduler\
  \ to run the batch file daily. This can save you the trouble of manually restarting\
  \ the service each time you encounter the issue."
