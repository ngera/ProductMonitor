title: Audio during call not working on Bose QC35 II
body: "I have been successfully using my Bose QC35 II wireless headphones for a couple\
  \ of years with MS Teams and all of a sudden, it has stopped working properly...\r\
  \n\r\nWhen in a call, people can hear me (through the Bose's mic), but I can't hear\
  \ them. I have already tried disconnecting and reconnecting my headphones and a\
  \ lot of configuration options in Windows and Teams, but haven't found the solution\
  \ yet.\r\n\r\nI have also tried to disable the \"Handsfree Telephony\" service in\
  \ the bluetooth device menu (which I found here). When this setting is disabled,\
  \ I do get audio in the test call, but then my mic isn't selectable in Teams, so\
  \ that's also not a solution.\r\n\r\n \r\n\r\nCan someone please help?\r\n\r\nWindows\
  \ specifications:\r\n\r\nEdition Windows 10 Enterprise\r\nVersion 22H2\r\nInstalled\
  \ on ‎03/‎10/‎2022\r\nOS build 19045.2728\r\nExperience Windows Feature Experience\
  \ Pack 120.2212.4190.0\r\nTeams version: 1.6.00.6754 (64-bit). It was last updated\
  \ on 04/04/2023.\r\n\r\nmuhammad_kekereekun's avatar\r\nmuhammad_kekereekun\r\n\
  Apr 05, 2023\r\nIt sounds like you've already tried some troubleshooting steps,\
  \ so here are some additional things you can try to resolve the issue with your\
  \ Bose QC35 II headphones not working properly with Microsoft Teams:\r\n\r\n1. Update\
  \ your headphones firmware: Make sure your Bose headphones are running the latest\
  \ firmware version. To do this, download and install the Bose Connect app on your\
  \ smartphone or computer. Connect your headphones to the app and check if there\
  \ are any available updates.\r\n\r\n2. Check your audio device settings: In Microsoft\
  \ Teams, click on your profile picture and select \"Settings\". In the \"Devices\"\
  \ tab, make sure that your headphones are selected as both the \"Speaker\" and \"\
  Microphone\". Also, check the audio device settings in Windows by right-clicking\
  \ on the volume icon in the taskbar and selecting \"Open Sound settings\". Under\
  \ \"Choose your output device\" and \"Choose your input device\", select your Bose\
  \ headphones.\r\n\r\n3. Disable exclusive mode: In Windows sound settings, click\
  \ on your Bose headphones and select \"Properties\". Go to the \"Advanced\" tab\
  \ and uncheck the \"Allow applications to take exclusive control of this device\"\
  \ option. This can sometimes cause conflicts with other applications using the same\
  \ audio device.\r\n\r\n4. Restart the Windows Audio service: In the Windows search\
  \ bar, type \"services.msc\" and open the Services app. Scroll down and find \"\
  Windows Audio\". Right-click on it and select \"Restart\". This will restart the\
  \ Windows Audio service and may fix any issues related to it.\r\n\r\n5. Try using\
  \ the headphones on another device: To rule out any hardware issues with your headphones,\
  \ try connecting them to another device and test if they work properly with Microsoft\
  \ Teams. If they do, the issue may be with your computer's Bluetooth or audio settings.\r\
  \n\r\nHopefully, one of these solutions will help you fix the issue with your Bose\
  \ QC35 II headphones and Microsoft Teams.\r\n6 Replies\r\n\r\nRobi Czitron's avatar\r\
