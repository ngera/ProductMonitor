title: Fix no audio issue after Windows update
body: "As always, Windows updates break something or the other. This time, it was\
  \ the audio. After the update, the system restarted and the audio was gone.\r\n\r\
  \nFinally, I went to the tab in System > Sound > Properties. The audio enhancements\
  \ were turned ON, so I turned them OFF, and voilà - I can listen to dope EDM again."
