relevance:
  system: 'You are a strict relevance classifier. Reply with JSON only.

    '
  few_shot:
    enabled: true
    n_positive: 3
    n_negative: 2
  template: "Is this post about {product_display}?\r\n\r\n{few_shot_block}\r\nReply\
    \ with a single JSON object: {{\"relevant\": true|false, \"confidence\": 0.0-1.0}}\r\
    \n\r\nTitle: {title}\r\nBody: {body}\n"
classify:
  system: "You are classifying user feedback about Windows Media Platform.\r\nReturn\
    \ only JSON matching the requested schema. Use multi-label where\r\napplicable.\
    \ Use \"unknown\" or null rather than guessing.\n"
  extras_instructions: ''
  few_shot:
    enabled: true
    n_positive: 2
    n_negative: 1
  template: "Read the post and return JSON matching the schema.\r\n\r\nENABLED AREAS\
    \ (multi-select; use the id):\r\n{areas}\r\n\r\nCONTENT TYPES (multi-select):\r\
    \n{content_types}\r\n\r\nIf you tag bug_report, fill bug_* including repro_steps\
    \ extracted verbatim\r\nif present (else null and bug_repro_steps_quality=\"none\"\
    ).\r\nIf you tag feature_request, fill request_*.\r\n{extras_instructions}\r\n\
    \r\nFor each entity assign:\r\n  type (controlled vocab), vendor, product, version,\
    \ role, confidence (0-1), verbatim.\r\n  role: feature_implicated (user blames\
    \ it) | hardware_in_use | software_in_use.\r\n\r\n{few_shot_block}\r\nREGEX PRE-PASS\
    \ HINTS (confirm/correct, add what was missed, discard false positives):\r\n \
    \ vendors: {vendor_hits}\r\n  KB numbers: {kb_numbers}\r\n  build numbers: {build_numbers}\r\
    \n{parent_block}\r\nPOST:\r\nTITLE: {title}\r\nBODY: {body}\r\nENGAGEMENT: {engagement}\r\
    \nSOURCE: {source}\r\n\r\nReturn ONLY valid JSON.\n"
