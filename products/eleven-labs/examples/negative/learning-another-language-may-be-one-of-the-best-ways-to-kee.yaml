title: Learning another language may be one of the best ways to keep your brain healthy
body: Learning another language is a highly complex mental activity . It requires
  people to remember words, distinguish unfamiliar sounds, recognize patterns, work
  out grammatical rules, and retrieve the right expression at the right moment. All
  of this happens while listening, interpreting, and preparing a response. Could all
  this mental activity also help keep an aging brain healthier ? Research suggests
  it can . Concerns about memory and dementia can send aging adults looking for ways
  to exercise their brain and maintain cognitive function, whether it is solving crossword
  puzzles or playing a musical instrument. Language learning might not seem like the
  same kind of brain exercise, but it is a complex activity that engages several mental
  processes at once. Read full article Comments
