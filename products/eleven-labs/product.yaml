id: eleven-labs
display: Eleven Labs
description: |
  ElevenLabs is an AI voice generation and voice agents platform that enables enterprises, creators, and developers to generate ultra-realistic speech, create voice agents, and produce audio content across 70+ languages. The platform includes ElevenCreative for content creation (text-to-speech, music, video, sound effects) and ElevenAgents for deploying conversational AI agents for customer service and support.

