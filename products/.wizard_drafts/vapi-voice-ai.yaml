slug: vapi-voice-ai
display: Vapi Voice AI
description: "Vapi (vapi.ai) is voice AI infrastructure that lets developers and businesses\
  \ create AI agents that can make and receive phone calls, and hold natural, real-time\
  \ voice conversations with humans. Instead of building and maintaining the complex\
  \ real-time audio stack themselves, teams use Vapi to go from idea to a production\
  \ voice agent in minutes.\r\n\r\nHow It Works (Technical Architecture)\r\n\r\nVapi\
  \ orchestrates the full real-time voice pipeline:\r\n\r\n\r\nSpeech-to-Text (STT\
  \ / transcriber) — converts the caller's speech into text in real time.\r\nLarge\
  \ Language Model (LLM) — processes the transcript, reasons, and generates the agent's\
  \ response. Vapi is model-agnostic: users can plug in providers like OpenAI, Anthropic,\
  \ Google, or bring their own custom LLM.\r\nText-to-Speech (TTS / voice) — converts\
  \ the response back into natural-sounding speech, with a wide choice of voice providers\
  \ and voices.\r\n\r\n\r\nVapi handles everything that makes real-time conversation\
  \ hard: low latency (sub-500ms average response time), interruption handling (barge-in),\
  \ turn-taking, endpointing (knowing when the caller has finished speaking), background\
  \ noise filtering, and telephony (inbound/outbound calls, phone numbers, SIP integration).\
  \ It also supports web-based voice calls, not just telephony."
