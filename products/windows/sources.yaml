sources:
  - id: reddit
    type: reddit
    credibility_weight: 1.0
    streams:
      - subreddit: Windows11
        display: r/Windows11
        engagement_threshold: 5
      - subreddit: Windows
        display: r/Windows
        engagement_threshold: 5
      - subreddit: WindowsHelp
        display: r/WindowsHelp
        engagement_threshold: 3
      - subreddit: sysadmin
        display: r/sysadmin
        engagement_threshold: 10

  # Hacker News via Algolia search (no auth required).
  # Comments are deferred; enable include_tags: [story, comment] after
  # parent_context hydration lands (V1.5 — see SOURCE_HN.md §6.3).
  - id: hn
    type: hn
    credibility_weight: 1.0
    streams:
      - name: hn-windows
        search_queries:
          - "windows 11"
          - "windows update"
          - "microsoft copilot"
        include_tags: [story]
        max_pages_per_query: 5
        hits_per_page: 100

  # GitHub Issues on Microsoft dev-tool repos.
  # Requires GITHUB_TOKEN in .env (fine-grained PAT, public-repo read).
  - id: github_issues
    type: github_issues
    credibility_weight: 1.2
    streams:
      - name: microsoft-dev-tools
        repos:
          - microsoft/PowerToys
          - microsoft/terminal
          - microsoft/WSL
          - microsoft/winget-cli
          - microsoft/Windows-Dev-Home
        exclude_labels: [duplicate, "Resolution-Duplicate", "Status: by design"]
        fetch_comments: true
        max_comments_per_issue: 50

  # Microsoft Tech Community via RSS (no auth).
  # Current URL pattern (verified 2026-06-27):
  #   https://techcommunity.microsoft.com/t5/s/gxcuf89792/rss/Category?category.id={id}
  # The /category/<id>/rss shape from the Lithium docs returns 404.
  # The "Windows Insider" category requires login — gated, dropped from V1.
  # Microsoft Q&A (learn.microsoft.com/answers) no longer exposes RSS feeds
  # as of 2026; dropped from V1.
  - id: microsoft_community
    type: microsoft_community
    credibility_weight: 0.9
    streams:
      - name: tech-community-windows
        display: Tech Community — Windows
        feed_url: https://techcommunity.microsoft.com/t5/s/gxcuf89792/rss/Category?category.id=Windows
