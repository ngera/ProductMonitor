id: vocal-bridge-ai
display: Vocal Bridge AI
description: |
  Vocal Bridge AI is a developer platform that adds real-time voice capabilities to AI agents and applications. It provides SDKs for React, JavaScript, and Flutter, enabling bidirectional voice-UI interactions, voice-enabled LLM agents, and outbound phone calling as a tool. Built by veterans from Meta AI, Salesforce, and Otter.ai, it simplifies voice integration without requiring WebRTC expertise.

schedule: weekly

