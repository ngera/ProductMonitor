features:
  trust_plugins_dir: false
  assistant_llm_enabled: true
  token_monitor_enabled: true
  prompt_caching_enabled: true
  scrapecreators_enabled: false
  evals_enabled: true
  snippet_candidates_enabled: true
  snippet_from_review_enabled: true
  wizard_enabled: true
  wizard_v2_enabled: true
  prompt_suggestions_enabled: true
  rationale_enabled: true
  observability_traces_enabled: true
  digest_v2_enabled: true
  scheduler_enabled: false
  admin_token_tracker_enabled: true
  # ADR-0022 — retry transient 429/5xx/timeouts in source HTTP calls.
  # Default true: this is a bug fix, not a new capability. ADR-0006's
  # "flag off by default" rule is about user-visible features, not
  # fixes for a class of silent-failure that specifically bites
  # unattended runs. Removing the flag is tracked in ADR-0022's
  # sunset plan; leaving it in place as a break-glass.
  http_retry_enabled: true
  # ADR-0025 — outbound webhook POST at end of run. Requires
  # `notifications.webhook_url` in app.yaml. Off by default; opting in
  # is a two-step motion (flag + URL) so nothing fires by accident.
  run_notifications_enabled: false
  # ADR-0023 — concurrent stream fetch via ThreadPoolExecutor.
  # Flipped to true after the source thread-safety audit landed
  # (stackex backoff lock, reddit praw lock, scrapecreators atomic
  # credit reservation). Tune via `fetching.max_concurrent_streams`
  # and `fetching.max_concurrent_per_host` in app.yaml. Defaults 4 / 1.
  fetch_concurrency_enabled: true
