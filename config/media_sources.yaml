# Curated list of technology + business media publications shown on the
# Admin > Connections page under "Media coverage sources". These are the
# publications whose articles typically get tagged with `news_discussion`
# by the classifier and land in the digest v2 Media Coverage section
# (report_v2_design.md §4.8).
#
# To actually FETCH from any of these, add the feed_url to a product's
# `products/<id>/sources.yaml` under `type: rss` — the same generic RSS
# source plugin handles all of them.
#
# Add / remove / edit entries here without a code deploy — the loader
# in pipeline/media_sources.py reads this file at request time.
# Feed URLs occasionally change or disappear when publishers restructure;
# if a listed feed stops working, update or drop it here.

media_sources:
  - name: Wired
    domain: wired.com
    feed_url: https://www.wired.com/feed/rss
  - name: The Verge
    domain: theverge.com
    feed_url: https://www.theverge.com/rss/index.xml
