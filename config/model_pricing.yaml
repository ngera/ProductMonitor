# Per-model pricing for LLM cost estimates (POST_V1_PLAN §4.11).
#
# All rates are USD per 1M tokens.
# Update as providers change pricing. Numbers here are lower-bound estimates
# for the UI; verify against your actual bill.
#
# Fields per model:
#   input        base per-token input rate
#   cache_read   input rate for cache-hit reads (Anthropic, some others)
#   cache_write  input rate for cache-write requests (Anthropic; slight premium)
#   output       per-token completion rate
#
# When a model is missing from this file, the UI shows "tokens only" instead
# of a dollar figure.

pricing:
  # --- Anthropic ---
  claude-opus-4-7:
    input: 15.00
    cache_read: 1.50
    cache_write: 18.75
    output: 75.00
  claude-sonnet-4-6:
    input: 3.00
    cache_read: 0.30
    cache_write: 3.75
    output: 15.00
  claude-haiku-4-5-20251001:
    input: 1.00
    cache_read: 0.10
    cache_write: 1.25
    output: 5.00

  # --- OpenAI ---
  gpt-4o:
    input: 2.50
    cache_read: 1.25
    output: 10.00
  gpt-4o-mini:
    input: 0.15
